  [profile.bio]
  en = """
Masaya Taniguchi is a JSPS Postdoctoral Research Fellow in the Explainable AI Team
at RIKEN Advanced Intelligence Project (AIP). He earned his Bachelor of Science
in Mathematics from Gakushuin University and his Master of Science and Ph.D. in
Information Science from JAIST. His research focuses on formal semantics, categorial grammar,
substructural logic, theorem proving, and the computational analysis of language.
"""

